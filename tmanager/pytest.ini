[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = tests.py test_*.py
norecursedirs = venv .venv env staticfiles node_modules
addopts = -q
filterwarnings =
    ignore:No directory at:UserWarning
env =
    D:SECRET_KEY=test-secret-key-not-for-production
    D:FRONTEND_URL=http://localhost:5173
    D:DEFAULT_FROM_EMAIL=noreply@example.com