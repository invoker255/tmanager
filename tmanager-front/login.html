<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация | T-Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen font-sans">

    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/10 rounded-full blur-3xl -z-10 animate-pulse"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-cyan-500/10 rounded-full blur-3xl -z-10 animate-pulse" style="animation-delay: 2s;"></div>

    <div class="bg-slate-800/80 backdrop-blur-md p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700/80">
        
        <div class="flex items-center justify-center space-x-3 mb-8">
            <span class="text-3xl">⚡</span>
            <span class="text-2xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">T-Manager</span>
        </div>

        <div class="flex justify-around mb-8 border-b border-slate-700 pb-2">
            <button id="tab-login" class="text-lg font-bold text-indigo-400 border-b-2 border-indigo-500 pb-3 focus:outline-none transition w-1/2">
                Войти
            </button>
            <button id="tab-register" class="text-lg font-bold text-slate-400 pb-3 hover:text-white focus:outline-none transition w-1/2">
                Регистрация
            </button>
        </div>

        <div id="error-box" class="hidden bg-rose-500/10 border border-rose-500/30 text-rose-400 p-4 rounded-xl mb-6 text-sm"></div>

        <form id="auth-form" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-350 mb-1.5">Имя пользователя</label>
                <input type="text" id="username" required autocomplete="username"
                       placeholder="Введите логин"
                       class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none text-white transition placeholder-slate-500">
            </div>
            
            <div id="email-container" class="hidden">
                <label class="block text-sm font-medium text-slate-350 mb-1.5">Email</label>
                <input type="email" id="email" autocomplete="email"
                       placeholder="example@mail.com"
                       class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none text-white transition placeholder-slate-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-350 mb-1.5">Пароль</label>
                <input type="password" id="password" required autocomplete="current-password"
                       placeholder="••••••••"
                       class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none text-white transition placeholder-slate-500">
            </div>

            <div id="confirm-password-container" class="hidden">
                <label class="block text-sm font-medium text-slate-350 mb-1.5">Повторите пароль</label>
                <input type="password" id="confirm-password" autocomplete="new-password"
                       placeholder="••••••••"
                       class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 focus:outline-none text-white transition placeholder-slate-500">
            </div>

            <button type="submit" id="submit-btn" 
                    class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold text-white transition shadow-lg shadow-indigo-600/30 active:scale-[0.98]">
                Войти в аккаунт
            </button>
        </form>
    </div>

    <script>
        const API_URL = 'https://tmanager-frontend.onrender.com';
        let isLoginMode = true;

        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');
        const submitBtn = document.getElementById('submit-btn');
        const authForm = document.getElementById('auth-form');
        const errorBox = document.getElementById('error-box');
        
        const emailContainer = document.getElementById('email-container');
        const emailInput = document.getElementById('email');
        const confirmPasswordContainer = document.getElementById('confirm-password-container');
        const confirmPasswordInput = document.getElementById('confirm-password');

        tabLogin.addEventListener('click', () => {
            if (isLoginMode) return;
            isLoginMode = true;
            
            tabLogin.className = "text-lg font-bold text-indigo-400 border-b-2 border-indigo-500 pb-3 focus:outline-none transition w-1/2";
            tabRegister.className = "text-lg font-bold text-slate-400 pb-3 hover:text-white focus:outline-none transition w-1/2";
            
            submitBtn.innerText = "Войти в аккаунт";
            emailContainer.classList.add('hidden');
            emailInput.removeAttribute('required');
            confirmPasswordContainer.classList.add('hidden');
            confirmPasswordInput.removeAttribute('required');
            errorBox.classList.add('hidden');
        });

        tabRegister.addEventListener('click', () => {
            if (!isLoginMode) return;
            isLoginMode = false;
            
            tabRegister.className = "text-lg font-bold text-indigo-400 border-b-2 border-indigo-500 pb-3 focus:outline-none transition w-1/2";
            tabLogin.className = "text-lg font-bold text-slate-400 pb-3 hover:text-white focus:outline-none transition w-1/2";
            
            submitBtn.innerText = "Создать аккаунт";
            emailContainer.classList.remove('hidden');
            emailInput.setAttribute('required', 'required');
            confirmPasswordContainer.classList.remove('hidden');
            confirmPasswordInput.setAttribute('required', 'required');
            errorBox.classList.add('hidden');
        });

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = "Загрузка...";

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value.trim();

            if (!isLoginMode) {
                if (password !== confirmPasswordInput.value) {
                    showError("Пароли не совпадают!");
                    resetSubmitButton();
                    return;
                }
            }

            const endpoint = isLoginMode ? `${API_URL}/login/` : `${API_URL}/register/`;
            const payload = { username, password };
            if (!isLoginMode) payload.email = email;
            
            try {
    const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    const responseText = await response.text();
    const data = responseText ? JSON.parse(responseText) : {};

    if (!response.ok) {
        let errorMessage = 'Ошибка запроса';
        if (data.detail) {
            errorMessage = data.detail;
        } else if (typeof data === 'object') {
            errorMessage = Object.entries(data)
                .map(([key, val]) => `${key}: ${Array.isArray(val) ? val.join(' ') : val}`)
                .join('<br>');
        }
        throw new Error(errorMessage);
    }

    if (isLoginMode) {
        localStorage.setItem('authToken', data.token);
        window.location.href = 'index.html';
    } else {
        const loginResponse = await fetch(`${API_URL}/login/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const loginResponseText = await loginResponse.text();
        const loginData = loginResponseText ? JSON.parse(loginResponseText) : {};
        if (loginResponse.ok) {
            localStorage.setItem('authToken', loginData.token);
            window.location.href = 'index.html';
        } else {
            alert('Регистрация успешна! Теперь войдите в аккаунт.');
            tabLogin.click();
            resetSubmitButton();
        }
    }

} catch (err) {
    showError(err.message);
    resetSubmitButton();
}
        });

        function showError(message) {
            errorBox.innerHTML = message;
            errorBox.classList.remove('hidden');
        }

        function resetSubmitButton() {
            submitBtn.disabled = false;
            submitBtn.innerText = isLoginMode ? "Войти в аккаунт" : "Создать аккаунт";
        }

        if (localStorage.getItem('authToken')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
