<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления задачами</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">⚡</span>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">T-Manager</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-display" class="text-sm text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">Загрузка...</span>
                <button id="logout-btn" class="px-4 py-2 bg-rose-600/10 hover:bg-rose-600 text-rose-400 hover:text-white rounded-xl transition text-sm font-medium border border-rose-500/20">
                    Выйти
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
            <div class="flex flex-wrap gap-3 flex-1 max-w-3xl">
                <input type="text" id="search-input" placeholder="Поиск задач..." class="px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white placeholder-slate-500 transition w-full sm:w-64">
                
                <select id="filter-status" class="px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white transition">
                    <option value="all">Все статусы</option>
                    <option value="todo">Нужно сделать</option>
                    <option value="in_progress">В процессе</option>
                    <option value="done">Выполнено</option>
                </select>

                <select id="filter-priority" class="px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white transition">
                    <option value="all">Все приоритеты</option>
                    <option value="low">Низкий</option>
                    <option value="medium">Средний</option>
                    <option value="high">Высокий</option>
                </select>

                <select id="sort-select" class="px-4 py-2.5 bg-slate-800 border border-slate-700 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white transition">
                    <option value="newest">Сначала новые</option>
                    <option value="oldest">Сначала старые</option>
                    <option value="priority-desc">Приоритет: высокий ➔ низкий</option>
                </select>
            </div>

            <button id="open-modal-btn" class="px-5 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold text-white transition shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2">
                <span>➕</span>
                <span>Добавить задачу</span>
            </button>
        </div>

        <div id="main-error" class="hidden bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-xl mb-6"></div>

        <div id="tasks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <span class="text-6xl mb-4">📭</span>
            <h3 class="text-xl font-semibold text-slate-300">Список задач пуст</h3>
            <p class="text-slate-500 mt-1">Создайте свою первую задачу, чтобы начать работу!</p>
        </div>
    </main>

    <div id="task-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg p-6 shadow-2xl transition-all scale-95 duration-200">
            <div class="flex justify-between items-center mb-6">
                <h3 id="modal-title" class="text-xl font-bold text-white">Новая задача</h3>
                <button id="close-modal-btn" class="text-slate-400 hover:text-white transition text-2xl">&times;</button>
            </div>

            <form id="task-form" class="space-y-5">
                <input type="hidden" id="task-id">
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Название задачи</label>
                    <input type="text" id="task-title" required class="w-full px-4 py-2.5 bg-slate-700 border border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Описание</label>
                    <textarea id="task-description" rows="3" class="w-full px-4 py-2.5 bg-slate-700 border border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white transition resize-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5">Приоритет</label>
                        <select id="task-priority" class="w-full px-4 py-2.5 bg-slate-700 border border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white transition">
                            <option value="low">🟢 Низкий</option>
                            <option value="medium">🟡 Средний</option>
                            <option value="high">🔴 Высокий</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1.5">Статус</label>
                        <select id="task-status" class="w-full px-4 py-2.5 bg-slate-700 border border-slate-600 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white transition">
                            <option value="todo">📋 Нужно сделать</option>
                            <option value="in_progress">⚙️ В процессе</option>
                            <option value="done">✅ Выполнено</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-750">
                    <button type="button" id="cancel-modal-btn" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-650 rounded-xl font-medium text-white transition">Отмена</button>
                    <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold text-white transition shadow-lg shadow-indigo-600/30">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://tmanager-nnb2.onrender.com';
        const token = localStorage.getItem('authToken');

        if (!token) {
            window.location.href = 'login.html';
        }

        let allTasks = [];

        const tasksContainer = document.getElementById('tasks-container');
        const emptyState = document.getElementById('empty-state');
        const mainError = document.getElementById('main-error');
        const userDisplay = document.getElementById('user-display');
        
        const taskModal = document.getElementById('task-modal');
        const taskForm = document.getElementById('task-form');
        const modalTitle = document.getElementById('modal-title');
        
        const fieldId = document.getElementById('task-id');
        const fieldTitle = document.getElementById('task-title');
        const fieldDescription = document.getElementById('task-description');
        const fieldPriority = document.getElementById('task-priority');
        const fieldStatus = document.getElementById('task-status');

        document.addEventListener('DOMContentLoaded', () => {
            fetchUser();
            fetchTasks();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.removeItem('authToken');
                window.location.href = 'login.html';
            });

            document.getElementById('open-modal-btn').addEventListener('click', () => openModal());
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
            document.getElementById('cancel-modal-btn').addEventListener('click', closeModal);

            taskForm.addEventListener('submit', handleFormSubmit);

            document.getElementById('search-input').addEventListener('input', applyFilters);
            document.getElementById('filter-status').addEventListener('change', applyFilters);
            document.getElementById('filter-priority').addEventListener('change', applyFilters);
            document.getElementById('sort-select').addEventListener('change', applyFilters);
        }

        async function apiRequest(endpoint, method = 'GET', body = null) {
            mainError.classList.add('hidden');
            const options = {
                method,
                headers: {
                    'Authorization': `Token ${token}`,
                    'Content-Type': 'application/json'
                }
            };
            if (body) {
                options.body = JSON.stringify(body);
            }

            try {
                const response = await fetch(`${API_URL}${endpoint}`, options);
                if (response.status === 401) {
                    localStorage.removeItem('authToken');
                    window.location.href = 'login.html';
                }
                if (response.status === 204) return null;
                
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.detail || JSON.stringify(data));
                    return data;
                }
                return null;
            } catch (err) {
                mainError.innerText = `Ошибка API: ${err.message}`;
                mainError.classList.remove('hidden');
                console.error(err);
            }
        }

        async function fetchUser() {
            userDisplay.innerHTML = `👤 Личный кабинет`;
        }

        async function fetchTasks() {
            const data = await apiRequest('/api/tasks/');
            if (data) {
                if (data.results && Array.isArray(data.results)) {
                    allTasks = data.results;
                } else if (Array.isArray(data)) {
                    allTasks = data;
                } else {
                    allTasks = [];
                }
                applyFilters();
            }
        }

        function applyFilters() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();
            const statusFilter = document.getElementById('filter-status').value;
            const priorityFilter = document.getElementById('filter-priority').value;
            const sortBy = document.getElementById('sort-select').value;

            let filtered = [...allTasks];

            if (searchQuery) {
                filtered = filtered.filter(task => 
                    task.title.toLowerCase().includes(searchQuery) || 
                    (task.description && task.description.toLowerCase().includes(searchQuery))
                );
            }

            if (statusFilter !== 'all') {
                filtered = filtered.filter(task => task.status === statusFilter);
            }

            if (priorityFilter !== 'all') {
                filtered = filtered.filter(task => task.priority === priorityFilter);
            }

            if (sortBy === 'newest') {
                filtered.sort((a, b) => b.id - a.id);
            } else if (sortBy === 'oldest') {
                filtered.sort((a, b) => a.id - b.id);
            } else if (sortBy === 'priority-desc') {
                const weight = { 'high': 3, 'medium': 2, 'low': 1 };
                filtered.sort((a, b) => weight[b.priority] - weight[a.priority]);
            }

            renderTasks(filtered);
        }

        function renderTasks(tasks) {
            tasksContainer.innerHTML = '';
            
            if (tasks.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            tasks.forEach(task => {
                const priorityStyles = {
                    high: { bg: 'bg-rose-500/10 text-rose-400 border-rose-500/20', label: '🔴 Высокий' },
                    medium: { bg: 'bg-amber-500/10 text-amber-400 border-amber-500/20', label: '🟡 Средний' },
                    low: { bg: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', label: '🟢 Низкий' }
                };

                const statusLabels = {
                    todo: '📋 К выполнению',
                    in_progress: '⚙️ В процессе',
                    done: '✅ Выполнено'
                };

                const currentPriority = priorityStyles[task.priority] || priorityStyles.low;
                const isDone = task.status === 'done';

                const card = document.createElement('div');
                card.className = `bg-slate-800 border ${isDone ? 'border-slate-800/50 opacity-60' : 'border-slate-700'} rounded-2xl p-5 hover:border-slate-600 transition flex flex-col justify-between shadow-lg`;
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-3">
                            <span class="text-xs px-2.5 py-1 rounded-full border ${currentPriority.bg}">
                                ${currentPriority.label}
                            </span>
                            <span class="text-xs text-slate-400 font-medium">
                                ${statusLabels[task.status]}
                            </span>
                        </div>
                        <h4 class="text-lg font-bold text-white mb-2 ${isDone ? 'line-through text-slate-500' : ''}">
                            ${task.title}
                        </h4>
                        <p class="text-sm text-slate-400 line-clamp-3 mb-4">
                            ${task.description || 'Без описания.'}
                        </p>
                    </div>
                    
                    <div class="flex items-center justify-between pt-4 border-t border-slate-750 mt-auto">
                        <button onclick="toggleQuickStatus(${task.id}, '${task.status}')" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300 transition">
                            ${isDone ? '↩️ Вернуть в работу' : '✔️ Завершить'}
                        </button>
                        
                        <div class="flex items-center space-x-3">
                            <button onclick="openEditModal(${task.id})" class="text-slate-400 hover:text-white text-sm transition">✏️</button>
                            <button onclick="deleteTask(${task.id})" class="text-slate-400 hover:text-rose-400 text-sm transition">🗑️</button>
                        </div>
                    </div>
                `;
                tasksContainer.appendChild(card);
            });
        }

        function openModal(task = null) {
            taskForm.reset();
            if (task) {
                modalTitle.innerText = 'Редактировать задачу';
                fieldId.value = task.id;
                fieldTitle.value = task.title;
                fieldDescription.value = task.description || '';
                fieldPriority.value = task.priority;
                fieldStatus.value = task.status;
            } else {
                modalTitle.innerText = 'Новая задача';
                fieldId.value = '';
            }
            taskModal.classList.remove('hidden');
        }

        function closeModal() {
            taskModal.classList.add('hidden');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const payload = {
                title: fieldTitle.value,
                description: fieldDescription.value,
                priority: fieldPriority.value,
                status: fieldStatus.value
            };

            const id = fieldId.value;
            let result;

            if (id) {
                result = await apiRequest(`/api/tasks/${id}/`, 'PUT', payload);
            } else {
                result = await apiRequest('/api/tasks/', 'POST', payload);
            }

            if (result !== undefined) {
                closeModal();
                fetchTasks();
            }
        }

        function openEditModal(id) {
            const task = allTasks.find(t => t.id === id);
            if (task) openModal(task);
        }

        async function toggleQuickStatus(id, currentStatus) {
            const nextStatus = currentStatus === 'done' ? 'in_progress' : 'done';
            const result = await apiRequest(`/api/tasks/${id}/`, 'PATCH', { status: nextStatus });
            if (result) fetchTasks();
        }

        async function deleteTask(id) {
            if (confirm('Вы уверены, что хотите удалить эту задачу?')) {
                const response = await fetch(`${API_URL}/api/tasks/${id}/`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Token ${token}` }
                });
                if (response.ok) {
                    fetchTasks();
                } else {
                    alert('Не удалось удалить задачу');
                }
            }
        }
    </script>
</body>
</html>
